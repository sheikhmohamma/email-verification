<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
</head>
<body style="margin:0; padding:0; background-color:#efe8d8; font-family: Georgia, 'Times New Roman', serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#efe8d8; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px; background:#fffdf8; border-radius:10px; overflow:hidden; border:1px solid #d9d0ba;">

          <!-- Header -->
          <tr>
            <td style="background:#2f5233; padding: 34px 30px; text-align:center;">
              <p style="margin:0 0 6px; font-family: 'Courier New', monospace; font-size:11px; letter-spacing:3px; color:#d9a656;">MEMBER REGISTRY</p>
              <h1 style="margin:0; font-size:22px; color:#f6f1e6; font-family: Georgia, serif; font-weight:600;">Welcome to <?= siteName ?></h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 32px 34px 6px; color:#1f2328;">
              <p style="font-size:15px; line-height:1.6; margin:0 0 16px;">Hi <?= name ?>,</p>
              <p style="font-size:15px; line-height:1.6; margin:0 0 20px; color:#4a4e55;">
                Thanks for creating your account. Please confirm your email address to complete your registration.
              </p>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td style="padding: 4px 34px 8px; text-align:center;">
              <a href="<?= verifyLink ?>"
                 style="display:inline-block; background:#2f5233; color:#fffdf8; text-decoration:none; font-weight:bold; font-size:14px; letter-spacing:1px; font-family: 'Courier New', monospace; padding:14px 34px; border-radius:8px;">
                VERIFY EMAIL
              </a>
            </td>
          </tr>

          <!-- Expiry note -->
          <tr>
            <td style="padding: 14px 34px 26px; text-align:center;">
              <p style="font-size:12.5px; color:#8b8271; font-family: 'Courier New', monospace; letter-spacing:0.5px; margin:0;">
                VALID FOR <?= expiryMinutes ?> MINUTES
              </p>
            </td>
          </tr>

          <!-- Dashed perforation -->
          <tr>
            <td style="padding: 0 34px;">
              <div style="border-top:1.5px dashed #d9d0ba;"></div>
            </td>
          </tr>

          <!-- Fallback link -->
          <tr>
            <td style="padding: 20px 34px 26px;">
              <p style="font-size:12px; color:#8b8271; line-height:1.5; margin:0; font-family: Arial, sans-serif;">
                Button not working? Copy and paste this link into your browser:<br/>
                <a href="<?= verifyLink ?>" style="color:#2f5233; word-break:break-all;"><?= verifyLink ?></a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 34px; background:#f6f1e6; text-align:center;">
              <p style="font-size:12px; color:#8b8271; margin:0; font-family: Arial, sans-serif;">
                Thank you!<br/>
                <?= siteName ?> Team
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
