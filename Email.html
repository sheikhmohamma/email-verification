<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0; padding:0; background-color:#0f0a29; font-family:Arial, Helvetica, sans-serif;">

  <table
    role="presentation"
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="background-color:#0f0a29; padding:40px 20px;"
  >
    <tr>
      <td align="center">

        <!-- Main Card -->

        <table
          role="presentation"
          width="100%"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="
            max-width:480px;
            background-color:#1b1440;
            border-radius:20px;
            overflow:hidden;
            border:1px solid #33285f;
          "
        >

          <!-- ==========================================
               HEADER
               ========================================== -->

          <tr>
            <td
              align="center"
              style="
                background-color:#37e8c6;
                padding:32px 30px;
              "
            >

              <div
                style="
                  width:44px;
                  height:44px;
                  margin:0 auto 12px;
                  background-color:rgba(255,255,255,0.35);
                  border-radius:12px;
                  line-height:44px;
                  font-size:20px;
                  color:#16102f;
                "
              >
                ✦
              </div>

              <h1
                style="
                  margin:0;
                  font-size:22px;
                  line-height:1.3;
                  color:#16102f;
                  font-family:Arial, Helvetica, sans-serif;
                "
              >
                Welcome to <?= siteName ?>!
              </h1>

            </td>
          </tr>


          <!-- ==========================================
               BODY
               ========================================== -->

          <tr>
            <td
              style="
                padding:32px 34px 10px;
                color:#f5f3ff;
              "
            >

              <p
                style="
                  font-size:15px;
                  line-height:1.6;
                  margin:0 0 16px;
                  color:#f5f3ff;
                "
              >
                Hi <strong><?= name ?></strong>,
              </p>

              <p
                style="
                  font-size:15px;
                  line-height:1.6;
                  margin:0 0 16px;
                  color:#c9c3e8;
                "
              >
                Thanks for creating your account!

                Please verify your email address by clicking
                the button below.
              </p>

            </td>
          </tr>


          <!-- ==========================================
               VERIFY BUTTON
               ========================================== -->

          <tr>
            <td
              align="center"
              style="
                padding:10px 34px 26px;
              "
            >

              <a
                href="<?= verifyLink ?>"
                target="_blank"
                style="
                  display:inline-block;
                  background-color:#37e8c6;
                  color:#16102f;
                  text-decoration:none;
                  font-weight:bold;
                  font-size:15px;
                  padding:14px 34px;
                  border-radius:12px;
                  font-family:Arial, Helvetica, sans-serif;
                "
              >
                Verify Email
              </a>

            </td>
          </tr>


          <!-- ==========================================
               EXPIRY
               ========================================== -->

          <tr>
            <td
              align="center"
              style="
                padding:0 34px 30px;
              "
            >

              <p
                style="
                  font-size:13px;
                  color:#8a82b6;
                  margin:0;
                  line-height:1.5;
                "
              >
                This verification link will expire in
                <strong><?= expiryMinutes ?> minutes</strong>.
              </p>

            </td>
          </tr>


          <!-- ==========================================
               FALLBACK LINK
               ========================================== -->

          <tr>
            <td
              style="
                padding:20px 34px 30px;
                border-top:1px solid #33285f;
              "
            >

              <p
                style="
                  font-size:12px;
                  color:#6f668f;
                  line-height:1.5;
                  margin:0;
                "
              >

                Button not working?

                Copy and paste this link into your browser:

                <br><br>

                <a
                  href="<?= verifyLink ?>"
                  target="_blank"
                  style="
                    color:#37e8c6;
                    text-decoration:none;
                    word-break:break-all;
                  "
                >
                  <?= verifyLink ?>
                </a>

              </p>

            </td>
          </tr>


          <!-- ==========================================
               FOOTER
               ========================================== -->

          <tr>
            <td
              align="center"
              style="
                padding:22px 34px;
                background-color:#150f38;
              "
            >

              <p
                style="
                  font-size:12.5px;
                  color:#6f668f;
                  line-height:1.6;
                  margin:0;
                "
              >

                Thank you!<br>

                <strong style="color:#8a82b6;">
                  <?= siteName ?> Team
                </strong>

              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
