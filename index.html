<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Your Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>


  <main class="page">

    <!-- =====================================================
         REGISTER CARD
         ===================================================== -->

    <section class="card" id="registerCard">

      <div class="card-head">

        <div class="mark">✦</div>

        <h1>Create your account</h1>

        <p class="sub">
          Join us and get started in seconds
        </p>

      </div>


      <!-- Registration Form -->

      <form id="registerForm" novalidate>

        <!-- Full Name -->

        <div class="field">

          <label for="fullName">
            Full name
          </label>

          <div class="input-wrap">

            <span class="icon" aria-hidden="true">
              👤
            </span>

            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Jane Doe"
              autocomplete="name"
              maxlength="100"
              required
            >

          </div>

          <span
            class="error"
            id="err-fullName"
            aria-live="polite"
          ></span>

        </div>


        <!-- Email -->

        <div class="field">

          <label for="email">
            Email address
          </label>

          <div class="input-wrap">

            <span class="icon" aria-hidden="true">
              ✉️
            </span>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              maxlength="150"
              required
            >

          </div>

          <span
            class="error"
            id="err-email"
            aria-live="polite"
          ></span>

        </div>


        <!-- Password -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <span class="icon" aria-hidden="true">
              🔒
            </span>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              minlength="6"
              maxlength="128"
              required
            >

            <button
              type="button"
              class="toggle-vis"
              data-target="password"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

          <span
            class="error"
            id="err-password"
            aria-live="polite"
          ></span>

        </div>


        <!-- Confirm Password -->

        <div class="field">

          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="input-wrap">

            <span class="icon" aria-hidden="true">
              🔒
            </span>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              minlength="6"
              maxlength="128"
              required
            >

            <button
              type="button"
              class="toggle-vis"
              data-target="confirmPassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

          <span
            class="error"
            id="err-confirmPassword"
            aria-live="polite"
          ></span>

        </div>


        <!-- Submit -->

        <button
          type="submit"
          class="btn-primary"
          id="submitBtn"
        >

          <span class="btn-label">
            Create account
          </span>

          <span
            class="btn-spinner"
            hidden
            aria-hidden="true"
          ></span>

        </button>


        <!-- Server/Error Message -->

        <p
          class="banner"
          id="formBanner"
          hidden
          aria-live="polite"
        ></p>

      </form>


      <p class="footnote">
        Already have an account?
        <a href="#">
          Log in
        </a>
      </p>

    </section>



    <!-- =====================================================
         SUCCESS CARD
         ===================================================== -->

    <section
      class="card"
      id="successCard"
      hidden
    >

      <div class="result-icon success">
        ✓
      </div>

      <h2>
        Check your inbox
      </h2>

      <p class="sub">

        We've sent a verification link to

        <strong id="sentToEmail">
          your email
        </strong>.

        Click the link to activate your account.

        <br><br>

        The verification link expires in
        <strong>30 minutes</strong>.

      </p>


      <a
        href="verify.html"
        class="btn-ghost"
      >
        Didn't get it? Resend email
      </a>

    </section>

  </main>


  <!-- JavaScript -->

  <script src="script.js"></script>

</body>
</html>
